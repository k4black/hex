# On push to main: open or update the release PR, and publish + tag any
# crate version that is not on crates.io yet (the merged release PR).
# The GitHub App token lets the tag trigger release.yml and the release PR
# trigger test.yml; GITHUB_TOKEN events trigger no workflows.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'k4black'
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      # release-plz uses trusted publishing only when CARGO_REGISTRY_TOKEN is
      # unset. Export it only while the secret exists: the first publish,
      # before the crates exist on crates.io.
      - name: Use the crates.io token if set
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'k4black'
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
