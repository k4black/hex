version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by dist, and a hand-bumped copy fails dist's
    # up-to-date check on the tag. Its actions move with `dist init` upgrades.
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/setup-node
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
