[package]
name = "hex-cli"
description = "hex: a thin, deterministic control plane that runs agent CLIs (Claude Code, Codex, Pi, opencode) over a bounded, journaled graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["agents", "llm", "orchestration", "workflow", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hex"
path = "src/main.rs"

[dependencies]
hex-runtime = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ratatui = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
anstyle-query = { workspace = true }
unicode-width = { workspace = true }
humantime = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
