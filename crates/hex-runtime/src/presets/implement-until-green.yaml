version: 1
name: implement-until-green
description: "One agent implements; the test gate is the only backpressure, looping until green"
example: "make the failing parser tests pass"

# The Ralph loop: one agent implements, the test gate is the only backpressure,
# and the loop repeats until the tests pass. No reviewer. The implement node
# finishes without emitting — a clean exit routes the synthesized `done`.
# Run it with:  hex run implement-until-green -p "…"
#
# REQUIRES a `test` check: the gate *is* this preset, so hex refuses to start
# until your project declares one. Add to .hex/config.yaml:
#   checks:
#     test: [pytest, -q]        # or [npm, test] / [cargo, test] / [make, test]

defaults:
  role: implementer
  context: fresh
  budget:
    attempts: 10
    elapsed: 30m

entry: implement

nodes:
  implement:
    agent:
      prompt: |
        You are making a focused change in this repository until the tests pass.

        Task: {{prompt}}

        Implement the smallest change that satisfies the task. Run the test
        suite yourself to find and fix failures — if you were
        sent back here, a gate found the tests still failing. Just finish when
        you believe the tests pass; no command is needed.
    on:
      done: test

  test:
    command:
      check: test
    on:
      passed: done
      failed: implement

  done:
    terminal: succeeded

accept:
  require: [test.passed]
  on_unmet: implement
