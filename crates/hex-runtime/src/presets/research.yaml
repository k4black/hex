version: 1
name: research
description: "One research pass — gather evidence, answer with sources; no critic"
example: "what do other CLIs use for shell completion generation?"

# One bounded research pass: gather evidence, answer, cite. No critic loop and
# no notes file — the whole answer lands in the node's final message, shown by
# `hex logs` and the end-of-run output.
#
# When one pass is not enough — the question is genuinely open-ended, or you
# want an adversarial critic judging sufficiency before the report — use
# `autoresearch`, which loops researcher → critic over `.hex/research-notes.md`.
# Run it with:  hex run research -p "…"   (or -f question.md)

defaults:
  role: researcher
  context: fresh
  budget:
    attempts: 2
    elapsed: 20m

entry: research

nodes:
  research:
    agent:
      prompt: |
        Research question: {{prompt}}

        Gather the evidence needed to answer it. Prefer primary sources (code,
        docs, official references) and name each one (URL, file:line, or the
        command you ran). Separate what you verified from what you inferred,
        and say plainly when something could not be established.

        Put the full answer in your final message: lead with the answer, then
        the evidence with its sources, then what remains uncertain. Just finish
        when it is written; no command is needed.
    on:
      done: done

  done:
    terminal: succeeded
