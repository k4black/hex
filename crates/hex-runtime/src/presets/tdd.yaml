version: 1
name: tdd
description: "Test-first: write a proven-failing test, then make it pass (proven green)"
example: "add input validation to the signup form"

# Test-first loop with a proven-red step: an agent writes a failing test, a gate
# proves it actually fails, another agent makes it pass, and a gate proves it
# green. The spec agent's result is handed to the implementer as {{spec.result}}.
# Both work agents finish without emitting (implicit `done`).
# Run it with:  hex run tdd -p "…"
#
# REQUIRES a `test` check — a red phase that cannot fail proves nothing, so hex
# refuses to start until your project declares one. In .hex/config.yaml:
#   checks:
#     test: [pytest, -q]        # or [npm, test] / [cargo, test] / [make, test]

defaults:
  role: implementer
  context: fresh
  budget:
    elapsed: 30m

entry: spec

nodes:
  spec:
    agent:
      # Revisited when `red` shows the new test did NOT fail, so continuing the
      # session lets it see what it already wrote instead of starting over.
      context: continue
      prompt: |
        Write a failing test that captures this task, before any implementation.

        Task: {{prompt}}

        Add a focused, well-named test that fails for the right reason. Do NOT
        implement the feature. In your final message, name the test file/name you
        added and what it asserts. Finish when the test is written.
    on:
      done: red

  # Prove the test is actually red before implementing. A failing suite is the
  # expected outcome here (→ implement); an already-green suite means the test
  # doesn't fail, so go back and write a real failing test.
  red:
    command:
      check: test
    on:
      failed: implement
      passed: spec

  implement:
    agent:
      # Revisited each round (the gate sends it back), so it continues its own
      # agent session rather than re-deriving the task and the codebase every
      # attempt. Needs a worker that can resume — codex and claude can; rebinding
      # the role to a `kind: command` worker makes the run refuse at compile time
      # naming this node, and `context: fresh` is the fix there.
      context: continue
      prompt: |
        Make the failing test pass with the smallest change.

        Task: {{prompt}}

        The test to satisfy was just written:
        {{spec.result}}

        Implement only what makes that test (and the rest of the suite) pass.
        Run the project's tests yourself to check. Finish when you believe it is green.
    on:
      done: green

  green:
    command:
      check: test
    on:
      passed: done
      failed: implement

  done:
    terminal: succeeded

accept:
  require: [green.passed]
  on_unmet: implement
