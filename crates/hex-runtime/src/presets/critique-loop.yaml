version: 1
name: critique-loop
description: "Cross-model loop — one agent implements, a different model reviews, until approved"
example: "add retry with exponential backoff to the HTTP client"

# The flagship built-in: the implementer writes, the reviewer critiques, and the
# loop repeats until the change is approved. Cross-model by default — the
# `reviewer` role runs a different agent from `implementer`, so the model judging
# the change is not the one that wrote it (see `roles:` in your config).
#
# Deliberately gate-free, so it runs in any repo with no setup. To add real test
# backpressure, declare a check and copy this graph:
#
#   hex graph critique-loop --source > .hex/graphs/critique-loop.yaml
#   # .hex/config.yaml:  checks: { test: [pytest, -q] }
#   # then add:
#   #   test:
#   #     command: { check: test }
#   #     on: { passed: done, failed: implement }
#   # and require it:  accept: { require: [review.approved, test.passed] }

defaults:
  role: implementer
  context: fresh
  budget:
    attempts: 12
    elapsed: 30m

entry: implement

nodes:
  implement:
    agent:
      prompt: |
        Task: {{prompt}}

        If a reviewer sent it back, address this feedback (empty on the first
        pass):
        {{review.result}}

        Implement the smallest change that satisfies the task. When you are
        done, run:  hex emit ready_for_review
      may_propose: [ready_for_review]
    on:
      ready_for_review: review

  review:
    agent:
      role: reviewer
      prompt: |
        Review the current working-tree changes against this task: {{prompt}}

        Run `git diff` (and `git status`) to see them. If the change is
        acceptable, run:
          hex emit approved
        Otherwise put concrete, actionable feedback in your final message (it is
        handed back to the implementer) and run:
          hex emit changes_requested
      may_propose: [approved, changes_requested]
    # At most 4 review rounds, however many attempts the run budget allows.
    budget:
      visits: 4
    on:
      approved: done
      changes_requested: implement

  done:
    terminal: succeeded

accept:
  require: [review.approved]
  # If `done` is somehow reached without an approval on record, go back and earn
  # one rather than failing the run outright.
  on_unmet: implement
