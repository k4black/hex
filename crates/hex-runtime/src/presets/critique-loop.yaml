version: 1
name: critique-loop

# The flagship built-in: claude implements, codex critiques (a different model
# reviews than wrote the code), a gate proves it, and the loop repeats until the
# change is approved AND the tests pass.
# Run it with:  hex run critique-loop -p "…"   (or -f prompt.md)
# `{{prompt}}` below is filled with the operator's prompt.

defaults:
  worker: claude
  context: fresh
  budget:
    attempts: 12
    elapsed: 30m

entry: implement

nodes:
  implement:
    agent:
      worker: claude
      prompt: |
        You are making a focused change in this repository.

        Task: {{prompt}}

        If a reviewer sent it back, address this feedback (empty on the first
        pass):
        {{review.result}}

        Implement the smallest change that satisfies the task. When you are
        done, run:  hex emit ready_for_review
      may_propose: [ready_for_review]
    on:
      ready_for_review: review

  review:
    agent:
      worker: codex
      prompt: |
        Review the current working-tree changes against this prompt: {{prompt}}

        Judge correctness, scope, and quality — review only, do not edit files.
        If the change is acceptable, run:
          hex emit approved
        Otherwise put concrete, actionable feedback in your final message (it is
        handed back to the implementer) and run:
          hex emit changes_requested
      may_propose: [approved, changes_requested]
    on:
      approved: test
      changes_requested: implement

  test:
    gate:
      run: [cargo, test]
    on:
      passed: done
      failed: implement

  done:
    terminal: succeeded

accept:
  require: [test.passed]
