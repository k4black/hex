version: 1
name: critique-loop
description: "Cross-model loop — one agent implements, a different model reviews, until approved"
example: "add retry with exponential backoff to the HTTP client"

# The flagship built-in: the implementer writes, the reviewer critiques, and the
# loop repeats until the change is approved. Cross-model by default — the
# `reviewer` role runs a different agent from `implementer`, so the model judging
# the change is not the one that wrote it (see `roles:` in your config).
#
# Deliberately gate-free, so it runs in any repo with no setup. To add real test
# backpressure, declare a check and copy this graph:
#
#   hex graph critique-loop --format source > .hex/graphs/critique-loop.yaml
#   # .hex/config.yaml:  checks: { test: [pytest, -q] }
#   # then add:
#   #   test:
#   #     command: { check: test }
#   #     on: { passed: done, failed: implement }
#   # and require it:  accept: { require: [review.approved, test.passed] }

defaults:
  role: implementer
  context: fresh
  budget:
    elapsed: 30m

entry: implement

nodes:
  implement:
    agent:
      # Revisited every round, so it continues its own agent session: the
      # implementer keeps what it already worked out instead of re-deriving the
      # task and the codebase on every attempt. The reviewer below deliberately
      # stays `fresh` — a review has to be an independent judgement, not a
      # continuation of the conversation that produced the code.
      #
      # Needs a worker that can resume (codex and claude can). If you rebind the
      # `implementer` role to a `kind: command` worker, the run is refused at
      # compile time naming this node — set `context: fresh` here in that case.
      context: continue
      prompt: |
        Task: {{prompt}}

        If a reviewer sent it back, address this feedback (empty on the first
        pass):
        {{review.result}}

        Implement the smallest change that satisfies the task. When it is done,
        state your verdict at the end of your final message — hex asks for the
        exact line to use.
      may_propose: [ready_for_review]
    on:
      ready_for_review: review

  review:
    agent:
      role: reviewer
      # Inherits `context: fresh`, and that is the point: every round is a fresh
      # pair of eyes on the *current* diff. A reviewer continuing its own session
      # would carry its earlier verdict into the next one, which is how a critic
      # talks itself into approving what it already argued about.
      prompt: |
        Review the current working-tree changes against this task: {{prompt}}

        Run `git diff` (and `git status`) to see them. If the change is
        acceptable say so in your verdict; otherwise put concrete, actionable
        feedback in your final message — it is handed back to the implementer.

      may_propose: [approved, changes_requested]
    # At most 4 review rounds, however much time the run has left.
    budget:
      visits: 4
    on:
      approved: done
      changes_requested: implement

  done:
    terminal: succeeded

accept:
  require: [review.approved]
  # If `done` is somehow reached without an approval on record, go back and earn
  # one rather than failing the run outright.
  on_unmet: implement
