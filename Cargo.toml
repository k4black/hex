[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"        # floor set by ratatui 0.30 (the live-preview TUI)
license = "MIT"
repository = "https://github.com/k4black/hex"

[workspace.dependencies]
# Internal crates (dependencies point strictly inward: proto <- kernel,
# proto/kernel <- worker, kernel/worker <- runtime, clients <- runtime).
hex-proto = { path = "crates/hex-proto" }
hex-kernel = { path = "crates/hex-kernel" }
hex-worker = { path = "crates/hex-worker" }
hex-runtime = { path = "crates/hex-runtime" }

# External, shared across the workspace so versions stay aligned.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"          # maintained serde_yaml fork ("The YAML Organization")
sha2 = "0.10"
fs4 = { version = "1", features = ["sync"] }   # OS advisory file locks (maintained fs2 successor)
uuid = { version = "1", features = ["v4"] }    # collision-resistant run-id suffixes
humantime = "2"              # parse `30m`/`2h`/`500ms` budget durations
# Safe wrappers for the POSIX signal calls; `killpg` is what lets a timed-out
# attempt take its whole process group down instead of orphaning grandchildren.
# A safe wrapper, so the workspace's `unsafe_code = "forbid"` still holds.
nix = { version = "0.30", features = ["signal"] }
thiserror = "2"              # derive Display/Error on the runtime error type
# inline-viewport TUI for the live run preview; unstable-rendered-line-info
# provides Paragraph::line_count for wrapping inserted lines.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
criterion = "0.7"
# Dev-only: test the `hex` binary end-to-end.
assert_cmd = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Thin release profile; tune later once there is real code to measure.
[profile.release]
lto = "thin"
