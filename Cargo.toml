[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"        # floor set by ratatui 0.30 (the live-preview TUI)
license = "MIT"
repository = "https://github.com/k4black/hex"
homepage = "https://github.com/k4black/hex"

[workspace.dependencies]
# Internal crates (dependencies point strictly inward: proto <- kernel,
# proto/kernel <- worker, kernel/worker <- runtime, clients <- runtime).
hex-proto = { path = "crates/hex-proto", version = "0.1.2" }
hex-kernel = { path = "crates/hex-kernel", version = "0.1.2" }
hex-worker = { path = "crates/hex-worker", version = "0.1.2" }
hex-runtime = { path = "crates/hex-runtime", version = "0.1.2" }

# External, shared across the workspace so versions stay aligned.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"          # maintained serde_yaml fork ("The YAML Organization")
# Insertion-ordered map, so a node's `on:` edges compile in the order the author
# wrote them rather than alphabetically. Already in the tree: yaml_serde uses it.
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
fs4 = { version = "1", features = ["sync"] }   # OS advisory file locks (maintained fs2 successor)
uuid = { version = "1", features = ["v4"] }    # collision-resistant run-id suffixes
humantime = "2"              # parse `30m`/`2h`/`500ms` budget durations
which = "8"                  # "is this agent CLI installed?" without spawning it
# Calendar math for the `yyyy-MM-dd` run-id prefix. No tzdb: the prefix is UTC.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Safe wrappers for the POSIX signal calls; `killpg` is what lets a timed-out
# attempt take its whole process group down instead of orphaning grandchildren.
# A safe wrapper, so the workspace's `unsafe_code = "forbid"` still holds.
nix = { version = "0.30", features = ["signal"] }
# Safe SIGINT/SIGTERM handling (delivery on a normal thread via a self-pipe, so
# no `unsafe` and no async-signal-safety constraints). Already in the tree:
# crossterm depends on it, so naming it directly adds no crates.
signal-hook = "0.4"
# Terminal styling. All five are already in the tree (anstream/anstyle/
# anstyle-query via clap, crossterm + unicode-width via ratatui), so naming them directly adds no
# crates — and `anstyle::Style` is the *same* vocabulary clap paints `--help`
# with, which is the only way help and output can look like one program.
anstyle = "1"
anstream = "1"               # only for `strip_str`: measure a painted cell's width
anstyle-query = "1"          # NO_COLOR / CLICOLOR / CLICOLOR_FORCE / TERM=dumb
unicode-width = "0.2"        # column width, not char count: `…` and `≥` are not 1 cell everywhere
crossterm = { version = "0.29", default-features = false }   # terminal::size only
# inline-viewport TUI for the live run preview; unstable-rendered-line-info
# provides Paragraph::line_count for wrapping inserted lines.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# Dev-only: test the `hex` binary end-to-end.
assert_cmd = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Thin release profile; tune later once there is real code to measure.
[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
